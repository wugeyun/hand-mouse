[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-mouse"
version = "0.1.10"
description = "Coarse webcam hand gestures for desktop mouse actions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hand-mouse contributors" }]
dependencies = [
    "mediapipe>=0.10.35",
    "opencv-contrib-python>=4.8",
    "numpy>=1.24",
    "pyautogui>=0.9.54",
    "screeninfo>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
hand-mouse = "hand_mouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hand_mouse = ["models/*.task"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
